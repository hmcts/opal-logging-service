---
name: Trial logging master alert to Teams

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: Send the clearly labelled test message to Teams
        required: true
        type: boolean
        default: false
      preview_red_card:
        description: Preview the RED card layout using successful build #420 as a sample link
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Preview or send the Teams test message
        env:
          SEND_TEST: ${{ inputs.send_test }}
          PREVIEW_RED_CARD: ${{ inputs.preview_red_card }}
          TEAMS_WEBHOOK_URL: ${{ secrets.OPAL_MASTER_ALERT_TEAMS_WEBHOOK }}
        run: |
          if [[ "$PREVIEW_RED_CARD" == "true" ]]; then
            python3 bin/ci/teams-master-alert.py
          else
            bash ./bin/ci/teams-master-alert-trial.sh
          fi
